name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner image already ships Android SDK Platform 36 and Build Tools 36.0.0.
      # No keystore.properties exists here, so the release APK is built unsigned:
      # this only proves that the R8-shrunk release variant still compiles.
      - name: Build, test and lint
        run: >-
          ./gradlew --stacktrace
          :app:assembleDebug
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleRelease
          :qa:iconpack:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: magic-themer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
